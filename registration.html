!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - BookNest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">
<div class="box form-box">
<h2>Create Account</h2>
<form onsubmit="registerUser(event)">
<label>Full Name</label>
<input type="text" id="name"><span class="error" id="nameErr"></span>
<label>Email</label>
<input type="text" id="email"><span class="error" id="emailErr"></span>
<label>Phone Number</label>
<input type="text" id="phone"><span class="error" id="phoneErr"></span>
<label>Address</label>
<input type="text" id="address"><span class="error" id="addressErr"></span>
<label>Password</label>
<input type="password" id="password"><span class="error" id="passErr"></span>
<label>Confirm Password</label>
<input type="password" id="confirm"><span class="error" id="confirmErr"></span>
<br><button type="submit">Register</button>
<p class="success" id="result"></p>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
</div>
</div>
<script src="script.js"></script>
<script>
showNav();
</script>
</body>
</html>
