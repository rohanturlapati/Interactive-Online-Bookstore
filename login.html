<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - BookNest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">
<div class="box form-box">
<h2>Login</h2>
<form onsubmit="loginUser(event)">
<label>Email</label>
<input type="text" id="email"><span class="error" id="emailErr"></span>
<label>Password</label>
<input type="password" id="password"><span class="error" id="passErr"></span>
<br><button type="submit">Login</button>
<p class="error" id="result"></p>
</form>
<p>New user? <a href="registration.html">Register here</a></p>
</div>
</div>
<script src="script.js"></script>
<script>
showNav();
</script>
</body>
</html>
