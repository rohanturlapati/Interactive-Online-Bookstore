<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment - BookNest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">
<div class="box form-box">
<h2>Payment by Credit Card</h2>
<p id="amount"></p>
<form onsubmit="payNow(event)">
<label>Cardholder Name</label>
<input type="text" id="cardName"><span class="error" id="cardNameErr"></span>
<label>Card Number</label>
<input type="text" id="cardNumber" placeholder="1234 5678 9012 3456"><span class="error"
id="cardNumberErr"></span>
<label>Expiry Date (MM/YY)</label>
<input type="text" id="expiry" placeholder="12/28"><span class="error" id="expiryErr"></span>
<label>CVV</label>
<input type="password" id="cvv" maxlength="3"><span class="error" id="cvvErr"></span>
<br><button type="submit">Pay Now</button>
</form>
<p><small>This is a simulated payment. No real money is charged.</small></p>
</div>
</div>
<script src="script.js"></script>
<script>
showNav();
paymentPage();
</script>
</body>
</html>
