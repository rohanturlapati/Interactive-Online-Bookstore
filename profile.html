<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - BookNest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">
<div class="box">
<h2>My Profile</h2>
<p><b>Name:</b> <span id="pName"></span></p>
<p><b>Email:</b> <span id="pEmail"></span></p>
<p><b>Phone:</b> <span id="pPhone"></span></p>
<p><b>Address:</b> <span id="pAddress"></span></p>
</div>
<div class="box form-box">
<h2>Edit Profile</h2>
<form onsubmit="updateProfile(event)">
<label>Full Name</label>
<input type="text" id="name"><span class="error" id="nameErr"></span>
<label>Phone Number</label>
<input type="text" id="phone"><span class="error" id="phoneErr"></span>
<label>Address</label>
<input type="text" id="address"><span class="error" id="addressErr"></span>
<br><button type="submit">Update Profile</button>
<p class="success" id="result"></p>
</form>
</div>
</div>
<script src="script.js"></script>
<script>
showNav();
profilePage();
</script>
</body>
</html>
